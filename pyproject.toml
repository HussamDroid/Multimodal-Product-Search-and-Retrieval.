[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "souqlens"
version = "0.1.0"
description = "English, Arabic and image retrieval for product catalogs, with reproducible evaluation."
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "Pillow>=10.4,<14"]

[project.optional-dependencies]
ml = ["sentence-transformers>=3.4,<6", "torch>=2.2,<3"]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.20,<1"]
dev = ["httpx>=0.27,<1"]
import = ["openpyxl>=3.1,<4"]

[project.scripts]
souqlens = "souqlens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
souqlens = ["web/*.html"]
